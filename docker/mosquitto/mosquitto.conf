# Plain MQTT: published on 127.0.0.1 only (compose.yaml), for tools and tests on this machine.
# Delete this listener where nothing local needs it (docs/security/tls.md).
listener 1883

# MQTT over TLS (Phase 17, docs/security/tls.md): what every device and service uses.
# Certificates from the `certs` service; entrypoint.sh copies the key so the mosquitto user can read it.
listener 8883
certfile /mosquitto/data/tls/server.crt
keyfile /mosquitto/data/tls/server.key
tls_version tlsv1.2

# Security (Phase 15g, docs/security/security.md): every client signs in, and may only use its topics.
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# Reliability (Phase 15f, docs/testing/reliability.md).
# Keep sessions and queued QoS 1 messages across a broker restart (saved on shutdown and every 60 s).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# A persistent client (the receiver) that is down gets its messages queued, up to this many. 100 sensors
# at 5 s are 20 msg/s, so 100000 covers a receiver outage of about 80 minutes. Beyond it, newest are dropped.
max_queued_messages 100000
max_inflight_messages 100
# Forget a persistent session nobody has used for a day (e.g. a test receiver's), with its queue.
persistent_client_expiration 1d

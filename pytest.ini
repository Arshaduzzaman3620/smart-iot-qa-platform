[pytest]
testpaths = tests
addopts = -ra --browser-channel=chrome
filterwarnings =
    # Third-party deprecation inside Starlette's TestClient, not our code.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
markers =
    unit: pure logic, no services needed
    api: FastAPI endpoints against MySQL
    mqtt: publish/subscribe against the Mosquitto broker
    integration: full receive chain (broker -> receiver -> MySQL)
    ui: dashboard behaviour in a real browser, API responses mocked
    e2e: whole stack, sensor message to rendered dashboard

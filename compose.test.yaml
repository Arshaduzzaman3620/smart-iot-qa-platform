# The full automated test suite in Docker, on its own broker and a throwaway in-memory MySQL.
# Separate from compose.yaml (own project, no host ports), so it can run while the dev stack is up
# and never touches the dev database.
#
#   docker compose -f compose.test.yaml run --rm --build tests                  # everything
#   docker compose -f compose.test.yaml run --rm tests pytest tests/unit -q      # any pytest args
#   docker compose -f compose.test.yaml down                                    # stop broker + MySQL
name: smart-iot-test

services:
  # Test certificates in a throwaway volume (the dev stack's ./certs stays untouched).
  certs:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: tests
    image: smart-iot/tests:local
    command: ["python", "docker/tls/make_certs.py", "/certs"]
    volumes:
      - certs:/certs

  mqtt:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      SENSOR_MQTT_PASSWORD: sensor-test
      RECEIVER_MQTT_PASSWORD: receiver-test
      API_MQTT_PASSWORD: api-test
      QA_MQTT_PASSWORD: qa-test
    volumes:
      - ./docker/mosquitto:/mosquitto/config:ro
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_iot
      MYSQL_USER: smart_iot_user
      MYSQL_PASSWORD: test-only
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # Over TCP (127.0.0.1), as the app user, against the app database. During first-start setup
      # the image runs a temporary server reachable only through the local socket, so a socket
      # ping (-h localhost) reported healthy too early and init-db was refused (CI, 2026-10-29).
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 3306 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" > /dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  tests:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      target: tests
    image: smart-iot/tests:local
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: smart_iot
      MYSQL_USER: smart_iot_user
      MYSQL_PASSWORD: test-only
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      SENSOR_MQTT_PASSWORD: sensor-test
      RECEIVER_MQTT_PASSWORD: receiver-test
      API_MQTT_PASSWORD: api-test
      QA_MQTT_PASSWORD: qa-test
      # TLS tests (tests/mqtt/test_tls.py): the broker's TLS listener and the CA that signed it.
      # Everything else uses plain 1883 here, to keep the suite fast and the proxies simple.
      MQTT_TLS_PORT: "8883"
      TLS_CA_FILE: /certs/ca.crt
      # Only for running the AI QA assistant in this container (the tests never call the API).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A missing service is a failure here, not a skip.
      REQUIRE_SERVICES: "1"
      INIT_DB_WAIT: "60"
    # Create the schema, then run whatever command was given (default: pytest).
    entrypoint: ["sh", "-c", "python -m database.init_db && exec \"$$@\"", "--"]
    command: ["pytest"]
    volumes:
      - certs:/certs:ro
    depends_on:
      mqtt:
        condition: service_started
      mysql:
        condition: service_healthy

volumes:
  certs:
